name: Build RED SIGNAL CLIENT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar --stacktrace

      - name: Package Fabric Mod JAR
        run: |
          python3 -c "
          import zipfile
          src = 'build/libs/RED-SIGNAL-CLIENT-6.4.jar'
          dst = 'build/libs/RED-SIGNAL-CLIENT-Fabric.jar'
          with zipfile.ZipFile(src, 'r') as z_in, zipfile.ZipFile(dst, 'w', compression=zipfile.ZIP_DEFLATED) as z_out:
              for item in z_in.infolist():
                  fn = item.filename
                  if (fn.startswith('net/minecraft/') or 
                      fn.startswith('com/mojang/') or 
                      fn.startswith('net/minecraftforge/') or
                      fn.startswith('assets/minecraft/') or 
                      fn.startswith('assets/realms/') or 
                      fn.startswith('data/') or
                      fn.startswith('linux/') or
                      fn.startswith('darwin/') or
                      fn.startswith('win-x64/') or
                      fn.startswith('win-x86/')):
                      continue
                  z_out.writestr(item, z_in.read(fn))
          print('Fabric mod jar created successfully!')
          "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RED-SIGNAL-CLIENT
          path: build/libs/*.jar
          retention-days: 30

      - name: Create or update release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RED SIGNAL CLIENT v6.4
          draft: false
          prerelease: false
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build RED SIGNAL CLIENT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar --stacktrace

      - name: Package Fabric Mod JAR
        run: |
          pip install pillow
          python3 -c "
          import zipfile, io
          from PIL import Image

          src = 'build/libs/RED-SIGNAL-CLIENT-6.4.jar'
          dst = 'build/libs/RED-SIGNAL-CLIENT-Fabric.jar'
          bg_path = 'src/main/resources/client/images/background.png'

          # Convert custom background to square panorama textures for Minecraft title screen
          im = Image.open(bg_path).convert('RGB')
          im_square = im.resize((1024, 1024), Image.Resampling.LANCZOS)
          buf = io.BytesIO()
          im_square.save(buf, format='PNG')
          pano_bytes = buf.getvalue()

          with zipfile.ZipFile(src, 'r') as z_in, zipfile.ZipFile(dst, 'w', compression=zipfile.ZIP_DEFLATED) as z_out:
              for item in z_in.infolist():
                  fn = item.filename
                  # Retain ResourceLocation for compatibility on newer Minecraft versions
                  if fn.startswith('net/minecraft/') and not fn.startswith('net/minecraft/resources/ResourceLocation'):
                      continue
                  if (fn.startswith('com/mojang/') or 
                      fn.startswith('net/minecraftforge/') or 
                      fn.startswith('assets/minecraft/') or 
                      fn.startswith('assets/realms/') or 
                      fn.startswith('data/') or
                      fn.startswith('linux/') or
                      fn.startswith('darwin/') or
                      fn.startswith('win-x64/') or
                      fn.startswith('win-x86/') or
                      fn.startswith('io/netty/') or
                      fn.startswith('com/google/') or
                      fn.startswith('com/sun/') or
                      fn.startswith('META-INF/native/') or
                      fn.startswith('META-INF/native-image/') or
                      fn.startswith('META-INF/io.netty.')):
                      continue
                  z_out.writestr(item, z_in.read(fn))

              # Inject custom background as TitleScreen panorama
              for i in range(6):
                  z_out.writestr(f'assets/minecraft/textures/gui/title/background/panorama_{i}.png', pano_bytes)

              # Inject dark sleek button style
              import zlib, struct
              def create_button_png(bg_color, border_color, w=200, h=20):
                  raw = bytearray()
                  for y in range(h):
                      raw.append(0)
                      for x in range(w):
                          is_border = (x == 0 or x == w - 1 or y == 0 or y == h - 1)
                          is_inner = (x == 1 or x == w - 2 or y == 1 or y == h - 2)
                          if is_border: raw.extend(border_color)
                          elif is_inner: raw.extend([(b + c)//2 for b, c in zip(bg_color, border_color)])
                          else: raw.extend(bg_color)
                  def chunk(tag, data): return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
                  png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
                  return png

              btn_normal = create_button_png([16, 19, 25, 215], [108, 124, 255, 140])
              btn_hover = create_button_png([28, 32, 45, 240], [255, 60, 100, 240])
              btn_meta = b'{\"gui\":{\"scaling\":{\"type\":\"nine_slice\",\"width\":200,\"height\":20,\"border\":3}}}'

              z_out.writestr('assets/minecraft/textures/gui/sprites/widget/button.png', btn_normal)
              z_out.writestr('assets/minecraft/textures/gui/sprites/widget/button.png.mcmeta', btn_meta)
              z_out.writestr('assets/minecraft/textures/gui/sprites/widget/button_highlighted.png', btn_hover)
              z_out.writestr('assets/minecraft/textures/gui/sprites/widget/button_highlighted.png.mcmeta', btn_meta)
              z_out.writestr('assets/minecraft/texts/splashes.txt', b'Exclusive Minecraft Crash/Exploit Client\n')

          print('Fabric mod jar created successfully with custom panorama background and sleek UI style!')
          "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RED-SIGNAL-CLIENT
          path: build/libs/*.jar
          retention-days: 30

      - name: Create or update release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RED SIGNAL CLIENT v6.4
          draft: false
          prerelease: false
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
